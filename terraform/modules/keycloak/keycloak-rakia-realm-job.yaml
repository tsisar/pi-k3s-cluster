apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-test-realm-create
  namespace: keycloak
  labels:
    app: keycloak
spec:
  template:
    metadata:
      labels:
        app: keycloak-test-realm-create
    spec:
      restartPolicy: OnFailure
      containers:
        - name: keycloak-test-realm-create
          image: alpine/curl:latest
          command: ["/bin/sh"]
          args:
            - -c
            - |
              apk add --no-cache jq
              echo "Waiting for Keycloak to be ready..."
              until curl -f http://keycloak:8080/realms/master; do
                echo "Keycloak not ready yet, waiting..."
                sleep 10
              done
              
              echo "Keycloak is ready, creating test realm..."
              
              # Get admin token
              TOKEN=$(curl -s -X POST "http://keycloak:8080/realms/master/protocol/openid-connect/token" \
                -H "Content-Type: application/x-www-form-urlencoded" \
                -d "username=admin" \
                -d "password=admin" \
                -d "grant_type=password" \
                -d "client_id=admin-cli" | jq -r '.access_token')
              
              echo "Got admin token, creating test realm..."
              
              # Create test realm
              curl -X POST "http://keycloak:8080/admin/realms" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                -d @/config/test-realm.json
              
              echo "Rakia realm created successfully"
          volumeMounts:
            - name: realm-config
              mountPath: /config
      volumes:
        - name: realm-config
          configMap:
            name: keycloak-realm-config
