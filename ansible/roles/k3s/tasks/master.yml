---
- name: Ensure k3s config dir exists
  become: true
  ansible.builtin.file:
    path: "/etc/rancher/k3s/"
    state: directory
    mode: "0755"

- name: Render k3s config with TLS SANs
  become: true
  ansible.builtin.copy:
    dest: "/etc/rancher/k3s/config.yaml"
    mode: "0644"
    content: |
      write-kubeconfig-mode: "0644"
      tls-san:
      {% for san in k3s_tls_sans %}
        - {{ san }}
      {% endfor %}

- name: Install K3s master
  ansible.builtin.shell: |
    curl -sfL {{ k3s_install_url }} | sh -s - {% if k3s_disable_traefik %}--disable traefik{% endif %}
  args:
    creates: "{{ k3s_config_path }}"

- name: Read node-token from master
  ansible.builtin.slurp:
    src: "{{ k3s_token_path }}"
  register: k3s_token_raw

- name: Set fact with decoded token
  ansible.builtin.set_fact:
    k3s_token: "{{ k3s_token_raw.content | b64decode }}"

- name: Display instructions for copying kubeconfig
  ansible.builtin.debug:
    msg: |
      K3s master node is ready!
      To copy the kubeconfig to your local machine, run:
      ansible-playbook -i inventory/cluster.ini playbooks/copy-cluster-config.yml

- name: Check if Helm is installed
  ansible.builtin.command: which helm
  register: helm_check
  failed_when: false
  changed_when: false

- name: Install Helm
  ansible.builtin.shell: |
    curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  when: helm_check.rc != 0
  register: helm_install
  changed_when: helm_install.rc == 0
