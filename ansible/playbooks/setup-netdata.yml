---
- name: Install and configure Netdata on Ubuntu 24 (Master and Workers)
  hosts: ser
  become: true

  vars:
    # Master configuration
    netdata_allow_from: "192.168.88.*"
    netdata_memory_mode: "save"
    netdata_history: "3600"
    
    # Worker configuration
    netdata_timeout: "60"
    netdata_buffer_size: "10485760"
    netdata_reconnect_delay: "5"

  tasks:
    - name: Check if running on Ubuntu
      fail:
        msg: "This playbook is designed for Ubuntu 24.04 only"
      when: ansible_distribution != "Ubuntu" or ansible_distribution_version != "24.04"

    - name: Determine if this is a master node
      set_fact:
        is_master: "{{ inventory_hostname in groups['master'] }}"

    - name: Generate API key for master if not provided
      shell: uuidgen
      register: generated_api_key
      when: 
        - is_master
        - netdata_api_key is not defined or netdata_api_key == ""

    - name: Set final API key for master
      set_fact:
        final_api_key: "{{ netdata_api_key if netdata_api_key is defined and netdata_api_key != '' else generated_api_key.stdout }}"
      when: is_master

    - name: Set final API key for workers
      set_fact:
        final_api_key: "{{ netdata_api_key }}"
      when: 
        - not is_master
        - netdata_api_key is defined and netdata_api_key != ""

    - name: Fail if worker doesn't have API key
      fail:
        msg: "netdata_api_key variable must be set for workers. Run the master playbook first to get the API key."
      when: 
        - not is_master
        - netdata_api_key is not defined or netdata_api_key == ""

    - name: Install Netdata dependencies
      apt:
        name:
          - zlib1g-dev
          - uuid-dev
          - libmnl-dev
          - libuv1-dev
          - liblz4-dev
          - libssl-dev
          - cmake
          - gcc
          - g++
          - make
          - pkg-config
          - git
          - curl
          - jq
          - netcat-openbsd
        state: present
        update_cache: true

    - name: Download Netdata kickstart script
      get_url:
        url: https://get.netdata.cloud/kickstart.sh
        dest: /tmp/netdata-kickstart.sh
        mode: '0755'

    - name: Install Netdata
      shell: sh /tmp/netdata-kickstart.sh --stable-channel --disable-telemetry
      args:
        creates: /usr/sbin/netdata

    - name: Ensure Netdata service is enabled and started
      systemd:
        name: netdata
        state: started
        enabled: true
        daemon_reload: true

    - name: Create Netdata stream configuration directory
      file:
        path: /etc/netdata
        state: directory
        mode: '0755'

    - name: Configure Netdata stream for master
      copy:
        dest: /etc/netdata/stream.conf
        content: |
          [{{ final_api_key }}]
              enabled = yes
              allow from = {{ netdata_allow_from }}
              default memory mode = {{ netdata_memory_mode }}
              default history = {{ netdata_history }}
              enable replication = yes
        mode: '0644'
      when: is_master
      notify: restart netdata

    - name: Configure Netdata stream for worker
      copy:
        dest: /etc/netdata/stream.conf
        content: |
          [stream]
              enabled = yes
              destination = {{ hostvars[groups['master'][0]]['ansible_host'] }}:19999
              api key = {{ final_api_key }}
              timeout seconds = {{ netdata_timeout }}
              buffer size bytes = {{ netdata_buffer_size }}
              reconnect delay seconds = {{ netdata_reconnect_delay }}
        mode: '0644'
      when: not is_master
      notify: restart netdata

    - name: Clean up kickstart script
      file:
        path: /tmp/netdata-kickstart.sh
        state: absent

    - name: Verify Netdata is running
      systemd:
        name: netdata
        state: started

    - name: Display master information
      debug:
        msg: |
          Netdata Master {{ inventory_hostname }} is now running and ready to accept connections from workers.
          
          Access the dashboard at: http://{{ ansible_host }}:19999
          API Key for workers: {{ final_api_key }}
          
          Workers should connect to: {{ ansible_host }}:19999
          Using API Key: {{ final_api_key }}
      when: is_master

    - name: Display worker information
      debug:
        msg: |
          Netdata Worker {{ inventory_hostname }} is now configured to stream to master.
          
          Master IP: {{ hostvars[groups['master'][0]]['ansible_host'] }}
          API Key: {{ final_api_key }}
          
          Check the master dashboard at: http://{{ hostvars[groups['master'][0]]['ansible_host'] }}:19999
          to verify this worker appears in the Nodes list.
      when: not is_master

  handlers:
    - name: restart netdata
      systemd:
        name: netdata
        state: restarted
        daemon_reload: true
