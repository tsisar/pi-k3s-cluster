apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-config
  namespace: keycloak
  labels:
    app: keycloak
data:
  rakia-realm.json: |
    {
      "realm": "rakia",
      "enabled": true,
      "clients": [
        {
          "clientId": "krakend",
          "name": "KrakenD API Gateway",
          "description": "KrakenD API Gateway client for authentication",
          "enabled": true,
          "clientAuthenticatorType": "client-secret",
          "secret": "krakend-secret-123",
          "standardFlowEnabled": false,
          "implicitFlowEnabled": false,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": true,
          "publicClient": false,
          "protocol": "openid-connect",
          "attributes": {
            "access.token.lifespan": "300",
            "client.secret.creation.time": "1640995200",
            "saml.assertion.signature": "false",
            "saml.force.post.binding": "false",
            "saml.multivalued.roles": "false",
            "saml.encrypt": "false",
            "saml.server.signature": "false",
            "saml.server.signature.keyinfo.ext": "false",
            "exclude.session.state.from.auth.response": "false",
            "saml_force_name_id_format": "false",
            "saml.client.signature": "false",
            "tls.client.certificate.bound.access.tokens": "false",
            "saml.authnstatement": "false",
            "display.on.consent.screen": "false",
            "saml.onetimeuse.condition": "false"
          },
          "defaultClientScopes": [
            "web-origins",
            "role_list",
            "profile",
            "roles",
            "email"
          ],
          "optionalClientScopes": [
            "address",
            "phone",
            "offline_access",
            "microprofile-jwt"
          ],
          "protocolMappers": [
            {
              "name": "audience-mapper",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {
                "included.client.audience": "krakend-test",
                "access.token.claim": "true",
                "id.token.claim": "false"
              }
            },
            {
              "name": "username-mapper",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-property-mapper",
              "config": {
                "userinfo.token.claim": "true",
                "user.attribute": "username",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "claim.name": "preferred_username",
                "jsonType.label": "String"
              }
            },
            {
              "name": "realm-roles-mapper",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-realm-role-mapper",
              "config": {
                "user.attribute": "foo",
                "claim.name": "realm_access.roles",
                "jsonType.label": "String",
                "multivalued": "true",
                "userinfo.token.claim": "true",
                "id.token.claim": "true",
                "access.token.claim": "true"
              }
            }
          ]
        }
      ],
      "roles": {
        "realm": [
          {
            "name": "krakend-user",
            "description": "KrakenD user role"
          }
        ]
      },
      "users": [
        {
          "username": "krakend-service",
          "enabled": true,
          "serviceAccountClientId": "krakend",
          "credentials": [
            {
              "type": "password",
              "value": "krakend-service-password",
              "temporary": false
            }
          ],
          "realmRoles": ["krakend-user"]
        }
      ]
    }

