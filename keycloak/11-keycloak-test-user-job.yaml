apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-test-user-create
  namespace: keycloak
  labels:
    app: keycloak
spec:
  template:
    metadata:
      labels:
        app: keycloak-test-user-create
    spec:
      restartPolicy: OnFailure
      containers:
        - name: keycloak-test-user-create
          image: alpine/curl:latest
          command: ["/bin/sh"]
          args:
            - -c
            - |
              apk add --no-cache jq
              echo "Waiting for Keycloak to be ready..."
              until curl -f http://keycloak:8080/realms/master; do
                echo "Keycloak not ready yet, waiting..."
                sleep 10
              done
              
              echo "Keycloak is ready, creating test user in test realm..."
              
              # Get admin token
              TOKEN=$(curl -s -X POST "http://keycloak:8080/realms/master/protocol/openid-connect/token" \
                -H "Content-Type: application/x-www-form-urlencoded" \
                -d "username=admin" \
                -d "password=admin" \
                -d "grant_type=password" \
                -d "client_id=admin-cli" | jq -r '.access_token')
              
              echo "Got admin token, creating test user..."
              
              # Create test user
              curl -X POST "http://keycloak:8080/admin/realms/test/users" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                -d '{
                  "username": "testuser",
                  "email": "testuser@example.com",
                  "enabled": true,
                  "credentials": [
                    {
                      "type": "password",
                      "value": "testpass123",
                      "temporary": false
                    }
                  ]
                }'
              
              echo "Test user created, getting user ID..."
              USER_ID=$(curl -s -X GET "http://keycloak:8080/admin/realms/test/users?username=testuser" \
                -H "Authorization: Bearer $TOKEN" | jq -r '.[0].id')
              echo "User ID: $USER_ID"
              
              # Create admin role if it doesn't exist
              curl -X POST "http://keycloak:8080/admin/realms/test/roles" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                -d '{"name": "admin"}' || true # Ignore if role already exists
              echo "Admin role created, assigning to user..."
              
              # Get admin role ID
              ADMIN_ROLE_ID=$(curl -s -X GET "http://keycloak:8080/admin/realms/test/roles?search=admin" \
                -H "Authorization: Bearer $TOKEN" | jq -r '.[0].id')
              
              # Assign admin role to test user
              curl -X POST "http://keycloak:8080/admin/realms/test/users/$USER_ID/role-mappings/realm" \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                -d "[{\"id\": \"$ADMIN_ROLE_ID\", \"name\": \"admin\"}]"
              
              echo "Test user created successfully with admin role"
          volumeMounts:
            - name: realm-config
              mountPath: /config
      volumes:
        - name: realm-config
          configMap:
            name: keycloak-realm-config

